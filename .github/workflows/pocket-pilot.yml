name: Pocket pilot

on:
  pull_request:
  push:
    branches:
      - codex/pocket-public-evidence-pilot

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pocket.txt
      - run: python -m pip install -r requirements-pocket.txt
      - run: python pocket.py selftest
